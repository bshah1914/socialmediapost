# socialmediapost: every business in one console. Start with:  docker compose up -d --build
# The data (database, Instagram session, cards, saved settings) lives in the "socialmediapost-data" volume.
services:
  socialmediapost:
    build: .
    image: socialmediapost:latest
    container_name: socialmediapost
    restart: unless-stopped
    ports:
      - "${BIND:-127.0.0.1}:5000:5000"   # BIND=0.0.0.0 to reach it on the LAN without the proxy
    volumes:
      - socialmediapost-data:/data
    environment:
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      ADMIN_USER: ${ADMIN_USER:-}          # only used to create the account on the very first start
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  # Optional: HTTPS for post.cloudtrio.in with a free certificate (needs ports 80 and 443 free).
  # Start with:  docker compose --profile proxy up -d
  caddy:
    profiles: ["proxy"]
    image: caddy:2
    container_name: socialmediapost-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [socialmediapost]

volumes:
  socialmediapost-data:
  caddy-data:
